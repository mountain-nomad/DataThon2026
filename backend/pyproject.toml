[project]
name = "backend"
version = "0.1.0"
description = "Backend API: business logic, persistence, ML-service gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
