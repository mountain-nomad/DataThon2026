[project]
name = "backend"
version = "0.1.0"
description = "Cash desk video analysis: API, web UI and background jobs"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.10",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
