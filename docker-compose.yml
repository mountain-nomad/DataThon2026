# Minimal platform: one service (API + web UI + background jobs). frontend/ and ml/ are not used.
services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./backend/.env   # copy backend/.env.example; API_KEY is required
    environment:
      DATA_DIR: /data
    volumes:
      - backend-data:/data   # uploads and job JSON survive restarts
    restart: unless-stopped

volumes:
  backend-data:
