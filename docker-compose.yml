services:
  ml:
    build: ./ml
    ports: ["8001:8001"]
    volumes:
      - ./ml/artifacts:/app/artifacts   # retrain on host, then POST /model/reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      retries: 5

  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      ML_SERVICE_URL: http://ml:8001
      DATABASE_URL: sqlite:////app/data/app.db
    volumes:
      - backend-data:/app/data
    depends_on:
      ml:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  backend-data:
